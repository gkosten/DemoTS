name: Build Docs on Release Tag

on:
  push:
    tags:
      - 'Rel*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and repo name
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#Rel}"
          REPO_NAME="${{ github.event.repository.name }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build ordered file list
        id: file_list
        env:
          ROOT_DIR: "${{ github.workspace }}"
        run: |
          mapfile -t all_files < <(find "$ROOT_DIR" -type f -name '*.md' -not -path "*/.git/*" | sort)

          ordered_files=()
          has_toc=false

          # 1. Первым — Оглавление.md из корня (если есть)
          for f in "${all_files[@]}"; do
            if [[ "$(basename "$f")" == "Оглавление.md" ]] && [[ "$(dirname "$f")" == "$ROOT_DIR" ]]; then
              ordered_files+=("$f")
              has_toc=true
              break
            fi
          done

          # 2. Папки с числовыми префиксами в корне
          mapfile -t dirs < <(find "$ROOT_DIR" -mindepth 1 -maxdepth 1 -type d \
            -exec bash -c '[[ "$(basename "$1")" =~ ^[0-9]+ ]]' _ {} \; \
            | sort)

          for dir in "${dirs[@]}"; do
            mapfile -t files_in_dir < <(find "$dir" -maxdepth 1 -type f -name '*.md' | sort)

            declare -a paired
            for f in "${files_in_dir[@]}"; do
              fname="$(basename "$f")"
              fprefix=$(echo "$fname" | grep -oE '^[0-9]+')
              [[ -z "$fprefix" ]] && fprefix=999
              paired+=("$fprefix|$f")
            done

            IFS=$'\n' sorted_paired=($(sort -t'|' -k1,1n <<<"${paired[*]}"))
            unset IFS

            for item in "${sorted_paired[@]}"; do
              file_path="${item#*|}"
              ordered_files+=("$file_path")
            done
          done

          # 3. Остальные файлы (по алфавиту)
          for f in "${all_files[@]}"; do
            skip=false
            for added in "${ordered_files[@]}"; do
              if [[ "$added" == "$f" ]]; then
                skip=true
                break
              fi
            done
            [[ "$skip" == false ]] && ordered_files+=("$f")
          done

          # Формируем строку аргументов с кавычками
          pandoc_args=""
          for f in "${ordered_files[@]}"; do
            pandoc_args+="\"$f\" "
          done

          if [ -z "$pandoc_args" ]; then
            echo "::error::No .md files found in the repository."
            exit 1
          fi

          echo "files=$pandoc_args" >> "$GITHUB_OUTPUT"
          echo "count=${#ordered_files[@]}" >> "$GITHUB_OUTPUT"

      - name: Convert to DOCX
        run: |
          FILES=${{ steps.file_list.outputs.files }}
          OUTPUT_FILE="${{ steps.vars.outputs.repo_name }}_${{ steps.vars.outputs.version }}.docx"

          echo "Итоговый файл: $OUTPUT_FILE"
          echo "Количество файлов: ${{ steps.file_list.outputs.count }}"

          eval pandoc \
            --from gfm \
            --to docx \
            --output "\"$OUTPUT_FILE\"" \
            --toc \
            --number-sections \
            --resource-path=. \
            $FILES

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          FILENAME: ${{ steps.vars.outputs.repo_name }}_${{ steps.vars.outputs.version }}.docx
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILENAME" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$FILENAME" --generate-notes --repo "${{ github.repository }}"
          fi
