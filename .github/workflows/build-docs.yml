name: Build Docs on Release Tag

on:
  push:
    tags:
      - 'Rel*'

  # Ручной запуск из раздела Actions.
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc, PDF engine and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            lmodern \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-cyrillic \
            fonts-dejavu-core

          pandoc --version
          xelatex --version
          kpsewhich lmodern.sty

      - name: Build DOCX and PDF
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          os.chdir(root)

          output_dir = root / "build"

          def is_source_file(path):
              """Исключаем служебные файлы и результаты сборки."""
              parts = path.relative_to(root).parts
              return (
                  path.is_file()
                  and ".git" not in parts
                  and parts[0] != "build"
              )

          def natural_key(value):
              """Естественная сортировка: 2 идёт раньше 10."""
              return tuple(
                  (0, int(part)) if part.isdigit()
                  else (1, part.casefold())
                  for part in re.split(r"(\d+)", str(value))
              )

          all_files = sorted(
              (
                  path
                  for path in root.rglob("*.md")
                  if is_source_file(path)
              ),
              key=lambda path: natural_key(
                  path.relative_to(root).as_posix()
              ),
          )

          if not all_files:
              raise SystemExit(
                  "В репозитории не найдено ни одного .md-файла."
              )

          ordered_files = []
          added = set()

          def add(path):
              if path not in added:
                  ordered_files.append(path)
                  added.add(path)

          # 1. Первым — Оглавление.md из корня.
          toc = root / "Оглавление.md"
          if toc in all_files:
              add(toc)

          # 2. Файлы непосредственно в корневых каталогах
          #    с числовыми префиксами: 01..., 02..., 10...
          numbered_dirs = sorted(
              (
                  path
                  for path in root.iterdir()
                  if path.is_dir()
                  and re.match(r"^\d+", path.name)
              ),
              key=lambda path: natural_key(path.name),
          )

          for directory in numbered_dirs:
              files = sorted(
                  (
                      path
                      for path in all_files
                      if path.parent == directory
                  ),
                  key=lambda path: natural_key(path.name),
              )

              for path in files:
                  add(path)

          # 3. Все остальные Markdown-файлы,
          #    в том числе из вложенных каталогов.
          for path in all_files:
              add(path)

          print("Порядок объединения файлов:", flush=True)
          for index, path in enumerate(ordered_files, start=1):
              print(
                  f"{index:3}. {path.relative_to(root)}",
                  flush=True,
              )

          # Ищем изображения также в отдельных каталогах:
          # images, attachments и других.
          image_extensions = {
              ".png", ".jpg", ".jpeg", ".gif",
              ".svg", ".webp", ".pdf",
          }

          image_dirs = sorted(
              {
                  path.parent
                  for path in root.rglob("*")
                  if is_source_file(path)
                  and path.suffix.lower() in image_extensions
              },
              key=lambda path: natural_key(
                  path.relative_to(root).as_posix()
              ),
          )

          resource_dirs = list(
              dict.fromkeys(
                  [str(root)]
                  + [str(path.parent) for path in ordered_files]
                  + [str(directory) for directory in image_dirs]
              )
          )

          print("\nКаталоги поиска изображений:", flush=True)
          for directory in resource_dirs:
              print(f"  {directory}", flush=True)

          repo_name = os.environ["GITHUB_REPOSITORY"].split("/", 1)[1]
          ref_name = os.environ["GITHUB_REF_NAME"]
          ref_type = os.environ["GITHUB_REF_TYPE"]

          if ref_type == "tag" and ref_name.startswith("Rel"):
              version = ref_name[len("Rel"):]
          else:
              version = ref_name

          # Безопасное имя выходных файлов.
          version = re.sub(r"[^\w.-]+", "_", version) or "unversioned"
          output_base = f"{repo_name}_{version}"

          output_dir.mkdir(exist_ok=True)

          docx_path = output_dir / f"{output_base}.docx"
          pdf_path = output_dir / f"{output_base}.pdf"

          common_args = [
              "pandoc",
              "--from=gfm",
              "--standalone",
              "--toc",
              "--number-sections",
              "--resource-path=" + os.pathsep.join(resource_dirs),
          ]

          # Каждый путь передаётся отдельным аргументом:
          # пробелы и кириллица не требуют eval или ручных кавычек.
          input_files = [str(path) for path in ordered_files]

          print(f"\nСоздание {docx_path.name}", flush=True)
          subprocess.run(
              common_args
              + [
                  "--to=docx",
                  "--output", str(docx_path),
              ]
              + input_files,
              check=True,
          )

          print(f"\nСоздание {pdf_path.name}", flush=True)
          subprocess.run(
              common_args
              + [
                  "--to=pdf",
                  "--pdf-engine=xelatex",
                  "--variable", "mainfont=DejaVu Serif",
                  "--variable", "sansfont=DejaVu Sans",
                  "--variable", "monofont=DejaVu Sans Mono",
                  "--variable", "geometry:margin=25mm",
                  "--variable", "papersize=a4",
                  "--output", str(pdf_path),
              ]
              + input_files,
              check=True,
          )

          print("\nСборка завершена:", flush=True)
          print(docx_path.relative_to(root), flush=True)
          print(pdf_path.relative_to(root), flush=True)
          PY

      - name: Upload workflow artifacts
        # Если PDF не собрался, сохраняем хотя бы готовый DOCX.
        if: ${{ always() && hashFiles('build/*.docx', 'build/*.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: compiled-documents
          path: |
            build/*.docx
            build/*.pdf
          if-no-files-found: error

      - name: Create or update GitHub Release
        # Релиз публикуем только после успешной сборки
        # и только для тегов с префиксом Rel.
        if: ${{ success() && startsWith(github.ref, 'refs/tags/Rel') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              build/*.docx \
              build/*.pdf \
              --clobber
          else
            gh release create "$TAG" \
              build/*.docx \
              build/*.pdf \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi