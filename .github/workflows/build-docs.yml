name: Build Docs on Release Tag

on:
  push:
    tags:
      - 'Rel*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and repo name
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#Rel}"
          REPO_NAME="${{ github.event.repository.name }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build ordered file list (Оглавление.md first, then folders by numeric prefix)
        id: file_list
        env:
          ROOT_DIR: "${{ github.workspace }}"
        run: |
          # Находим все .md файлы рекурсивно
          mapfile -t all_files < <(find "$ROOT_DIR" -type f -name '*.md' | sort)

          ordered_files=()
          has_toc=false

          # 1. Первым — Оглавление.md из корня (если есть)
          for f in "${all_files[@]}"; do
            if [[ "$(basename "$f")" == "Оглавление.md" ]] && [[ "$(dirname "$f")" == "$ROOT_DIR" ]]; then
              ordered_files+=("$f")
              has_toc=true
              break
            fi
          done

          # 2. Собираем список папок с числовыми префиксами (например, 01 remote_collection)
          # Ищем только прямые подпапки корня, у которых имя начинается с цифр
          mapfile -t dirs < <(find "$ROOT_DIR" -mindepth 1 -maxdepth 1 -type d \
            -exec bash -c '[[ "$(basename "$1")" =~ ^[0-9]+ ]]' _ {} \; \
            | sort)

          # Для каждой папки — сортируем файлы по числовому префиксу
          for dir in "${dirs[@]}"; do
            dir_name="$(basename "$dir")"
            # Извлекаем числовой префикс (первые цифры до первого не-цифры или пробела)
            prefix=$(echo "$dir_name" | grep -oE '^[0-9]+')

            # Находим файлы .md внутри этой папки
            mapfile -t files_in_dir < <(find "$dir" -maxdepth 1 -type f -name '*.md' | sort)

            # Сортируем файлы по их числовому префиксу (например, 01, 02)
            # Создаём временный массив с парами "префикс файл"
            declare -a paired
            for f in "${files_in_dir[@]}"; do
              fname="$(basename "$f")"
              fprefix=$(echo "$fname" | grep -oE '^[0-9]+')
              # Если префикса нет — ставим 999, чтобы такие файлы шли в конце папки
              [[ -z "$fprefix" ]] && fprefix=999
              paired+=("$fprefix|$f")
            done

            # Сортируем по префиксу численно
            IFS=$'\n' sorted_paired=($(sort -t'|' -k1,1n <<<"${paired[*]}"))
            unset IFS

            # Добавляем в итоговый список только путь к файлу
            for item in "${sorted_paired[@]}"; do
              file_path="${item#*|}"
              ordered_files+=("$file_path")
            done
          done

          # Если вдруг остались файлы вне пронумерованных папок — добавляем их в конец (по алфавиту)
          for f in "${all_files[@]}"; do
            skip=false
            # Проверяем, уже ли добавлен этот файл
            for added in "${ordered_files[@]}"; do
              if [[ "$added" == "$f" ]]; then
                skip=true
                break
              fi
            done
            if [[ "$skip" == false ]]; then
              ordered_files+=("$f")
            fi
          done

          # Формируем строку аргументов для Pandoc с кавычками
          pandoc_args=""
          for f in "${ordered_files[@]}"; do
            pandoc_args+="\"$f\" "
          done

          if [ -z "$pandoc_args" ]; then
            echo "::error::No .md files found in the repository."
            exit 1
          fi

          echo "files=$pandoc_args" >> "$GITHUB_OUTPUT"
          echo "count=${#ordered_files[@]}" >> "$GITHUB_OUTPUT"

      - name: Convert to DOCX
        run: |
          FILES=$(find docs -name "*.md" -printf '"%p" ')

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/data \
            -w /data \
            pandoc/core:3.5 \
              --from gfm \
              --to docx \
              --output "${{ steps.vars.outputs.repo_name }}_${{ steps.vars.outputs.version }}.docx" \
              --toc \
              --number-sections \
              --resource-path=. \
              $FILES

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          FILENAME: ${{ steps.vars.outputs.repo_name }}_${{ steps.vars.outputs.version }}.docx
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILENAME" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$FILENAME" --generate-notes --repo "${{ github.repository }}"
          fi
